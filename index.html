<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Happy Birthday</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Dancing+Script:wght@600&family=Poppins:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cream: #f3e8e2;
        --plum: #6b2349;
        --ink: #2a0f1e;
        --bg: #a8486f;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html {
        scroll-behavior: smooth;
        overflow-x: clip;
      }
      body {
        font-family: Poppins, system-ui, sans-serif;
        background: #7a2c55;
        color: var(--cream);
        overflow-x: hidden;
      }
      body.locked {
        overflow: hidden;
        height: 100%;
      }
      /* ---------- LANDING ---------- */
      #landing {
        position: fixed;
        inset: 0;
        z-index: 10;
        transition:
          opacity 0.9s,
          transform 0.9s;
        background: #b0587a;
        padding-top: env(safe-area-inset-top, 0px);
      }
      #landing.gone {
        opacity: 0;
        transform: translateY(-30px);
        pointer-events: none;
      }
      #landing > svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .stage {
        position: relative;
        height: 100%;
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        align-items: center;
        padding: 0 6vw;
        gap: 4vw;
      }
      .photo-wrap {
        position: relative;
        justify-self: center;
        width: min(34vw, 420px);
      }
      /* .frame{aspect-ratio:3/4;border-radius:14px;transform:rotate(-7deg);background:rgba(255,255,255,.12);border:1px dashed rgba(255,255,255,.4);backdrop-filter:blur(3px);overflow:hidden;display:grid;place-items:center;text-align:center;font-size:.85rem;padding:1rem;color:rgba(255,255,255,.7)} */
      .frame {
        display: block;
        width: 100%;
        height: auto;
        max-height: 68vh;
        object-fit: contain;
        transform: rotate(-7deg);
      }
      /* .frame{width:300px;height:300px;display:block} */
      .flower {
        position: absolute;
        left: -26px;
        top: -26px;
        width: 70px;
        transform: rotate(-7deg);
      }
      .love {
        font-family: "Dancing Script", cursive;
        font-size: 2rem;
        text-align: center;
        margin-top: 1.6rem;
        color: var(--cream);
      }
      .pad {
        max-width: 320px;
        justify-self: center;
        width: 100%;
      }
      h1 {
        font-family: "Cormorant Garamond", serif;
        font-weight: 600;
        font-size: clamp(2.2rem, 4.4vw, 3.6rem);
        line-height: 1.05;
        color: #f6e3e3;
        margin-bottom: 2.2rem;
      }
      .dots {
        display: flex;
        gap: 16px;
        margin-bottom: 2.2rem;
      }
      .dots i {
        width: 60px;
        height: 70px;
        border-radius: 14px;
        border: 1px solid rgba(255, 255, 255, 0.35);
        background: rgba(255, 255, 255, 0.14);
        display: grid;
        place-items: center;
        font-style: normal;
        font-size: 1.8rem;
        color: var(--cream);
        transition: 0.2s;
      }
      .dots i.on {
        background: rgba(240, 130, 167, 0.338);
      }
      .keys {
        display: grid;
        grid-template-columns: repeat(3, 80px);
        gap: 20px;
      }
      .keys button {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 0;
        background: var(--cream);
        color: var(--ink);
        font:
          500 1.4rem Poppins,
          sans-serif;
        cursor: pointer;
        box-shadow: 0 8px 16px rgba(60, 10, 35, 0.3);
        transition: transform 0.15s;
      }
      .keys button:hover {
        transform: translateY(-3px);
      }
      .keys button:active {
        transform: scale(0.94);
      }
      .keys .del {
        background: rgba(255, 255, 255, 0.2);
        color: var(--cream);
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: none;
      }
      .keys .z {
        grid-column: 2;
      }
      .shake {
        animation: shake 0.45s;
      }
      @keyframes shake {
        20%,
        60% {
          transform: translateX(-10px);
        }
        40%,
        80% {
          transform: translateX(10px);
        }
      }
      /* ---------- GALLERY ---------- */
      #bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }
      #bg svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .head,
      #rows {
        position: relative;
        z-index: 1;
      }
      #gallery {
        display: none;
        position: relative;
        overflow-x: clip;
        background: none;
        min-height: 100vh;
        padding: env(safe-area-inset-top, 0px) 6vw 6rem;
      }
      body.open #gallery {
        display: block;
      }
      .head {
        text-align: center;
        padding: 1rem 0 2rem;
      }
      .head h2 {
        font-family: "Cormorant Garamond", serif;
        font-size: clamp(2.4rem, 6vw, 4.5rem);
      }
      .head img {
        display: block;
        margin: 0 auto;
        max-width: 90%;
        max-height: none;
        height: auto;
        background: none;
      }
      #rows {
        display: flex;
        flex-direction: column;
        gap: 6vw;
        max-width: 1000px;
        margin: 0 auto;
      }
      .card {
        container-type: inline-size;
        width: min(46%, 420px);
      }
      .card.l {
        align-self: flex-start;
      }
      .card.r {
        align-self: flex-end;
      }
      .card {
        position: relative;
        aspect-ratio: 4/5;
        border-radius: 18px;
        overflow: hidden;
        cursor: pointer;
        opacity: 0;
        transition:
          transform 1s cubic-bezier(0.2, 0.8, 0.2, 1),
          opacity 1s;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
        background: linear-gradient(135deg, #c06a8c, #8b365c);
        border: 6px solid var(--cream);
      }
      .card.l {
        transform: translateX(-50px) rotate(-4deg);
      }
      .card.r {
        transform: translateX(50px) rotate(4deg);
      }
      .card.l {
        --t: -3deg;
      }
      .card.r {
        --t: 3deg;
      }
      .card:not(.in) {
        pointer-events: none;
      }
      .card.in {
        opacity: 1;
        transform: rotate(var(--t));
      }
      .card.in:hover {
        transform: scale(1.04) rotate(0deg);
        z-index: 3;
      }
      .card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .card .ph {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font:
          600 3rem "Cormorant Garamond",
          serif;
        color: rgba(255, 255, 255, 0.55);
        z-index: 0;
      }
      .card img {
        position: relative;
        z-index: 1;
      }
      /* .cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:2.5rem 1rem 1rem;text-align:center;background:linear-gradient(transparent,rgba(40,8,26,.85));font-family:'Dancing Script',cursive;font-size:1.5rem;opacity:0;transform:translateY(12px);transition:.35s} */
      .cap {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 6%;
        margin: 0 auto;
        width: max-content;
        max-width: 90%;
        z-index: 2;
        padding: 0.1em 0.8em 0.2em;
        border-radius: 99px;
        background: rgba(40, 8, 26, 0.78);
        text-align: center;
        font-family: "Dancing Script", cursive;
        font-size: clamp(0.7rem, 6cqw, 1.4rem);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        opacity: 0;
        transform: translateY(8px);
        transition: 0.35s;
      }
      .card:hover .cap {
        opacity: 1;
        transform: none;
      }
      @media (hover: none) {
        .cap {
          opacity: 1;
          transform: none;
        }
      }
      /* ---------- POPUP ---------- */
      #modal {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: none;
        place-items: center;
        background: rgba(30, 6, 20, 0.85);
        backdrop-filter: blur(6px);
        padding: 1.5rem;
      }
      #modal.show {
        display: grid;
        animation: fade 0.3s;
      }
      @keyframes fade {
        from {
          opacity: 0;
        }
      }
      #modal figure {
        max-width: min(92vw, 720px);
        text-align: center;
      }
      #modal img {
        max-width: 100%;
        max-height: 78vh;
        border-radius: 14px;
        border: 6px solid var(--cream);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
      #modal figcaption {
        font-family: "Dancing Script", cursive;
        font-size: 2rem;
        margin-top: 1rem;
      }
      #modal .x {
        position: absolute;
        top: calc(1rem + env(safe-area-inset-top, 0px));
        right: 1.2rem;
        font-size: 2.4rem;
        background: none;
        border: 0;
        color: var(--cream);
        cursor: pointer;
      }
      /* ---------- BALLOONS ---------- */
      #balloons {
        position: fixed;
        inset: 0;
        z-index: 40;
        pointer-events: none;
        overflow: hidden;
      }
      .b {
        position: absolute;
        bottom: -180px;
        left: var(--x);
        opacity: 0;
        will-change: transform, opacity;
        animation: fly var(--dur) cubic-bezier(0.3, 0.1, 0.5, 1) var(--delay)
          forwards;
      }
      .balloon {
        position: relative;
        width: var(--w);
        height: calc(var(--w) * 1.22);
        border-radius: 50% 50% 50% 50%/58% 58% 42% 42%;
        background:
          radial-gradient(
            circle at 32% 28%,
            rgba(255, 255, 255, 0.65) 0,
            rgba(255, 255, 255, 0) 28%
          ),
          var(--c);
        box-shadow: inset -6px -8px 14px rgba(0, 0, 0, 0.18);
        transform-origin: 50% 140%;
        animation: tilt var(--wd) ease-in-out var(--delay) infinite alternate;
      }
      .wave {
        animation: wave var(--wd) ease-in-out var(--delay) infinite alternate;
      }
      .balloon::before {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -7px;
        margin-left: -6px;
        border: 6px solid transparent;
        border-bottom: 9px solid var(--c);
        border-top: 0;
      }
      .balloon::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 100%;
        width: 1.5px;
        height: 55px;
        margin-top: 2px;
        background: rgba(255, 255, 255, 0.55);
        transform: translateX(-50%);
      }
      @keyframes fly {
        0% {
          transform: translateY(0);
          opacity: 0;
        }
        6% {
          opacity: 1;
        }
        80% {
          opacity: 1;
        }
        100% {
          transform: translateY(-135vh);
          opacity: 0;
        }
      }
      @keyframes wave {
        from {
          transform: translateX(calc(var(--amp) * -1));
        }
        to {
          transform: translateX(var(--amp));
        }
      }
      @keyframes tilt {
        from {
          transform: rotate(-9deg);
        }
        to {
          transform: rotate(9deg);
        }
      }
      /* ---------- MOBILE ---------- */
      @media (max-width: 800px) {
        #landing {
          overflow-y: auto;
        }
        .stage {
          grid-template-columns: 1fr;
          padding: 2.5rem 1.5rem;
          height: auto;
          min-height: 100%;
          gap: 2rem;
        }
        .photo-wrap {
          width: 50vw;
        }
        .love {
          font-size: 1.6rem;
          margin-top: 1rem;
        }
        .pad {
          margin: 0 auto 2rem;
          text-align: center;
        }
        .dots {
          justify-content: center;
          margin-bottom: 1.6rem;
        }
        h1 {
          margin-bottom: 1.4rem;
        }
        .dots i {
          width: 56px;
          height: 64px;
        }
        .keys {
          grid-template-columns: repeat(3, 66px);
          gap: 14px;
          justify-content: center;
        }
        .keys button {
          width: 66px;
          height: 66px;
        }
        .card {
          width: 64%;
        }
        .card {
          border-width: 4px;
          border-radius: 12px;
        }
      }
    </style>
  </head>
  <body class="locked">
    <!-- ================= LANDING ================= -->

      <div class="stage">

        </div>
      </div>
    </section>

    <!-- ================= GALLERY ================= -->
    <main id="gallery">
      <div id="bg">
        <svg
          viewBox="0 0 1300 785"
          preserveAspectRatio="xMidYMid slice"
          aria-hidden="true"
        >
          <defs>
            <path
              id="h"
              d="M50 88C20 62 2 44 2 25C2 11 13 2 26 2C37 2 46 8 50 16C54 8 63 2 74 2C87 2 98 11 98 25C98 44 80 62 50 88Z"
            />
          </defs>
          <rect width="1300" height="785" fill="#a8486f" />
          <polygon points="0,150 590,785 0,785" fill="#8b365c" />
          <polygon points="0,470 315,785 0,785" fill="#6b2349" />
          <polygon points="1300,310 830,785 1300,785" fill="#8b365c" />
          <polygon points="1300,590 1100,785 1300,785" fill="#6b2349" />
          <use
            href="#h"
            transform="translate(650 400) scale(10) translate(-50 -45)"
            fill="rgba(255,255,255,.38)"
          />
          <use
            href="#h"
            transform="translate(650 400) scale(6.4) translate(-50 -45)"
            fill="rgba(255,255,255,.28)"
          />
          <use
            href="#h"
            transform="translate(650 400) scale(3.2) translate(-50 -45)"
            fill="rgba(255,255,255,.3)"
          />
        </svg>
      </div>
      <div class="head">
        <img id="headImg" alt="" onerror="this.style.display = 'none'" />
      </div>
      <div id="rows"></div>
    </main>

    <!-- ================= POPUP ================= -->
    <div id="modal">
      <button class="x" aria-label="Close">&times;</button>
      <figure>
        <img id="mImg" alt="" />
        <figcaption id="mCap"></figcaption>
      </figure>
    </div>

    <script>
      /* ======== EDIT THESE ======== */
      const PASSCODE = "1010";
      const MAIN_PHOTO = "images/landing.jpg";
      const HEADER_IMAGE = "images/header.png"; // transparent PNG shown at the top of the gallery
      // 22 photos: put the file path and the name of who gave it
      const PHOTOS = [
        { src: "images/1.png", name: "Aimen" },
        { src: "images/2.png", name: "Sajid" },
        { src: "images/3.png", name: "Waqas" },
        { src: "images/4.png", name: "Manahil" },
        { src: "images/5.png", name: "Anam" },
        { src: "images/6.png", name: "Rabia Amjad" },
        { src: "images/7.png", name: "Chanda" },
        { src: "images/8.png", name: "Asim" },
        { src: "images/9.png", name: "Nida" },
        { src: "images/10.png", name: "Jamshad" },
        { src: "images/11.png", name: "Rafey" },
        { src: "images/12.jpeg", name: "Azib" },
        { src: "images/13.jpeg", name: "Aimen" },
        { src: "images/14.jpeg", name: "Ayesha" },
        { src: "images/15.jpeg", name: "Hoorain" },
        { src: "images/16.jpeg", name: "Hadi" },
        { src: "images/17.jpeg", name: "Adrish-" },
        { src: "images/18.jpeg", name: "Saman" },
        { src: "images/19.jpeg", name: "Phuppo" },
        { src: "images/20.jpeg", name: "Aimen" },
        { src: "images/21.jpeg", name: "Taha" },
        { src: "images/22.jpeg", name: "Shifa" },
        { src: "images/23.png", name: "Gabbarrr" },
        { src: "images/24.jpeg", name: "Hassaan" },
        { src: "images/25.png", name: "Emaan" },
      ];
      /* ============================ */

      const $ = (id) => document.getElementById(id);
      // never allow sideways scrolling
      window.addEventListener(
        "scroll",
        () => {
          if (window.scrollX) window.scrollTo(0, window.scrollY);
        },
        { passive: true },
      );

      // main photo (falls back to the hint text if the file is missing)
      $("headImg").src = HEADER_IMAGE;

      // keypad
      let code = "";
      const keys = $("keys");
      [1, 2, 3, 4, 5, 6, 7, 8, 9, "", 0, "⌫"].forEach((k) => {
        if (k === "") return;
        const b = document.createElement("button");
        b.textContent = k;
        if (k === 0) b.className = "z";
        if (k === "⌫") b.className = "del";
        b.onclick = () => press(String(k));
        keys.appendChild(b);
      });
      keys.insertBefore(
        Object.assign(document.createElement("span"), {
          style: "display:none",
        }),
        null,
      );

      function render() {
        [...$("dots").children].forEach((d, i) => {
          d.textContent = code[i] ? "•" : "";
          d.classList.toggle("on", !!code[i]);
        });
      }
      function press(k) {
        if (k === "⌫") code = code.slice(0, -1);
        else if (code.length < 4) code += k;
        render();
        if (code.length === 4) setTimeout(check, 200);
      }
      function check() {
        if (code === PASSCODE) return unlock();
        $("dots").classList.add("shake");
        setTimeout(() => {
          $("dots").classList.remove("shake");
          code = "";
          render();
        }, 450);
      }
      document.addEventListener("keydown", (e) => {
        if (!document.body.classList.contains("locked")) return;
        if (/^\d$/.test(e.key)) press(e.key);
        if (e.key === "Backspace") press("⌫");
      });

      function unlock() {
        $("landing").classList.add("gone");
        document.body.classList.remove("locked");
        document.body.classList.add("open");
        window.scrollTo(0, 0);
        setTimeout(() => ($("landing").style.display = "none"), 900);
        watch();
        launchBalloons();
      }

      // balloons: fly from bottom to top, then vanish (everything done by ~10s)
      function launchBalloons(count = 45) {
        const colors = [
          "#ff6b9d",
          "#ffd166",
          "#7bdff2",
          "#b8f2a1",
          "#c9a7ff",
          "#ff9f68",
          "#f6e3e3",
          "#ff4d6d",
        ];
        const wrap = document.createElement("div");
        wrap.id = "balloons";
        for (let i = 0; i < count; i++) {
          const b = document.createElement("div");
          b.className = "b";
          const inner = document.createElement("div");
          inner.className = "balloon";
          b.style.setProperty("--x", Math.random() * 94 + "vw");
          b.style.setProperty("--delay", (Math.random() * 4).toFixed(2) + "s"); // start spread over 0-4s
          b.style.setProperty(
            "--dur",
            (5 + Math.random() * 1).toFixed(2) + "s",
          ); // fly for 5-6s -> all done by ~10s
          inner.style.setProperty(
            "--w",
            (40 + Math.random() * 35).toFixed(0) + "px",
          );
          inner.style.setProperty(
            "--c",
            colors[Math.floor(Math.random() * colors.length)],
          );
          b.style.setProperty(
            "--amp",
            (25 + Math.random() * 30).toFixed(0) + "px",
          ); // how wide the wave is (25-55px each side)
          b.style.setProperty(
            "--wd",
            (1.8 + Math.random() * 1.4).toFixed(2) + "s",
          ); // time for one swing left<->right
          const wave = document.createElement("div");
          wave.className = "wave";
          wave.appendChild(inner);
          b.appendChild(wave);
          wrap.appendChild(b);
        }
        document.body.appendChild(wrap);
        setTimeout(() => wrap.remove(), 10500); // cleanup after they've vanished
      }

      // gallery: one card per line, zig-zag: left, then right below it, then left...
      const rows = $("rows");
      PHOTOS.forEach((p, i) => {
        const c = document.createElement("div");
        c.className = "card " + (i % 2 ? "r" : "l");
        c.innerHTML = `<div class="ph">${i + 1}</div><img src="${p.src}" alt="${p.name}" loading="lazy"><div class="cap">from ${p.name}</div>`;
        const im = c.querySelector("img");
        im.onload = () => {
          c.style.aspectRatio = im.naturalWidth + " / " + im.naturalHeight;
        };
        im.onerror = () => {
          im.style.display = "none";
        };
        c.onclick = () => openModal(p, c);
        rows.appendChild(c);
      });

      function watch() {
        const io = new IntersectionObserver(
          (es) =>
            es.forEach((e) => {
              if (e.isIntersecting) {
                e.target.classList.add("in");
                io.unobserve(e.target);
              }
            }),
          { threshold: 0.2 },
        );
        document.querySelectorAll(".card").forEach((c) => io.observe(c));
      }

      // popup
      let current = null;
      function openModal(p, c) {
        current = c;
        if (c.classList.contains("l") && c.nextElementSibling)
          clearTimeout(c.nextElementSibling._t); // opened: wait for close
        $("mImg").src = p.src;
        $("mImg").alt = p.name;
        $("mCap").textContent = "from " + p.name;
        $("modal").classList.add("show");
      }
      const closeModal = () => {
        if (!$("modal").classList.contains("show")) return;
        $("modal").classList.remove("show");
        const next =
          current &&
          current.classList.contains("l") &&
          current.nextElementSibling;
        if (next) {
          {
            const r = next.getBoundingClientRect();
            window.scrollTo({
              left: 0,
              top: r.top + window.scrollY - (innerHeight - r.height) / 2,
              behavior: "smooth",
            });
          }
          setTimeout(() => next.classList.add("in"), 450);
        }
        current = null;
      };
      $("modal").onclick = (e) => {
        if (e.target.id !== "mImg") closeModal();
      };
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });
    </script>
  </body>
</html>
